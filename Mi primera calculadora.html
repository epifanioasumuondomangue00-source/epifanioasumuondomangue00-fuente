<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi primera calculadora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3FA; --surface:#FFFFFF; --ink:#13213C; --muted:#5A6781; --line:#D5DDEA;
  --accent:#2F5BEA; --accent-ink:#FFFFFF; --ok:#12805C; --err:#B3261E; --code-bg:#E6EDF9;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101A2E; --surface:#182440; --ink:#E8EEFB; --muted:#9AA8C6; --line:#2B3A5C;
    --accent:#7C9BFF; --accent-ink:#0E1730; --ok:#4AD6A3; --err:#FF8A80; --code-bg:#1F2D4D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101A2E; --surface:#182440; --ink:#E8EEFB; --muted:#9AA8C6; --line:#2B3A5C;
  --accent:#7C9BFF; --accent-ink:#0E1730; --ok:#4AD6A3; --err:#FF8A80; --code-bg:#1F2D4D;
  color-scheme: dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; background:var(--bg); color:var(--ink); font-family:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif; line-height:1.5}
main{max-width:520px; margin:0 auto; padding:40px 20px 64px}
h1{font-size:clamp(2rem,8vw,3rem); font-weight:800; letter-spacing:-.03em; line-height:1.05; margin:0 0 8px}
.lead{color:var(--muted); margin:0 0 28px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:24px; margin-bottom:20px}
label{display:block; font-weight:600; font-size:.9rem; margin:0 0 6px}
input{
  width:100%; font:inherit; font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace; font-size:1.2rem;
  color:var(--ink); background:var(--code-bg); border:2px solid transparent; border-radius:10px; padding:12px 14px; min-height:48px;
}
input:focus-visible{outline:none; border-color:var(--accent)}
.campo{margin-bottom:18px}
.ops{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:20px}
.op{
  font:inherit; font-size:1.5rem; font-weight:600; cursor:pointer; min-height:52px;
  color:var(--ink); background:var(--code-bg); border:2px solid transparent; border-radius:10px;
}
.op[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.op:focus-visible,.calc:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
.calc{
  width:100%; font:inherit; font-weight:600; font-size:1rem; cursor:pointer; min-height:52px;
  color:var(--accent-ink); background:var(--accent); border:0; border-radius:10px;
}
.resultado{margin:20px 0 0; min-height:3.2rem}
.resultado .etiqueta{color:var(--muted); font-size:.9rem; margin:0}
.resultado .valor{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace; font-size:2rem; color:var(--ok); margin:0; overflow-wrap:anywhere}
.resultado .error{color:var(--err); font-weight:600; margin:0}
h2{font-size:1.05rem; font-weight:600; margin:0 0 12px}
ul{list-style:none; margin:0; padding:0; display:grid; gap:2px}
li{display:flex; justify-content:space-between; gap:12px; padding:10px 12px; border-radius:8px; font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace; font-size:.95rem}
li:nth-child(odd){background:var(--code-bg)}
.vacio{color:var(--muted); margin:0}
</style>
</head>
<body>
<main>
  <h1>Mi primera calculadora</h1>
  <p class="lead">Escribe dos números, elige una operación y pulsa Calcular.</p>

  <div class="panel">
    <div class="campo">
      <label for="n1">Número 1</label>
      <input id="n1" type="number" inputmode="decimal" step="any" autocomplete="off">
    </div>

    <label id="ops-label">Operación</label>
    <div class="ops" role="group" aria-labelledby="ops-label">
      <button type="button" class="op" data-op="+" aria-pressed="true" aria-label="Sumar">+</button>
      <button type="button" class="op" data-op="-" aria-pressed="false" aria-label="Restar">−</button>
      <button type="button" class="op" data-op="*" aria-pressed="false" aria-label="Multiplicar">×</button>
      <button type="button" class="op" data-op="/" aria-pressed="false" aria-label="Dividir">÷</button>
    </div>

    <div class="campo">
      <label for="n2">Número 2</label>
      <input id="n2" type="number" inputmode="decimal" step="any" autocomplete="off">
    </div>

    <button type="button" class="calc" id="calcular">Calcular</button>
    <div class="resultado" id="resultado" aria-live="polite"></div>
  </div>

  <div class="panel">
    <h2>Historial</h2>
    <ul id="historial"></ul>
    <p class="vacio" id="vacio">Aún no has hecho ninguna operación.</p>
  </div>
</main>

<script>
  let operador = "+";

  const inputN1 = document.getElementById("n1");
  const inputN2 = document.getElementById("n2");
  const salida = document.getElementById("resultado");
  const historial = document.getElementById("historial");
  const vacio = document.getElementById("vacio");
  const botonesOp = document.querySelectorAll(".op");

  // Elegir operador
  botonesOp.forEach((boton) => {
    boton.addEventListener("click", () => {
      operador = boton.dataset.op;
      botonesOp.forEach((b) => b.setAttribute("aria-pressed", String(b === boton)));
    });
  });

  function mostrarError(texto) {
    salida.innerHTML = "";
    const p = document.createElement("p");
    p.className = "error";
    p.textContent = texto;
    salida.appendChild(p);
  }

  function mostrarResultado(valor) {
    salida.innerHTML = "";
    const etiqueta = document.createElement("p");
    etiqueta.className = "etiqueta";
    etiqueta.textContent = "El resultado es:";
    const numero = document.createElement("p");
    numero.className = "valor";
    numero.textContent = valor;
    salida.append(etiqueta, numero);
  }

  function calcular() {
    // CORRECCIÓN 1: prompt/input devuelven TEXTO; Number() lo convierte en número
    const n1 = Number(inputN1.value);
    const n2 = Number(inputN2.value);

    if (inputN1.value.trim() === "" || inputN2.value.trim() === "") {
      mostrarError("Escribe los dos números.");
      return;
    }

    let resultado;

    if (operador === "+") {
      resultado = n1 + n2;
    } else if (operador === "-") {
      resultado = n1 - n2;
    } else if (operador === "*") {
      resultado = n1 * n2;
    } else if (operador === "/") {
      // CORRECCIÓN 3: no se puede dividir entre cero
      if (n2 === 0) {
        mostrarError("No se puede dividir entre cero.");
        return;
      }
      resultado = n1 / n2;
    }

    // Evita cosas como 0.1 + 0.2 = 0.30000000000000004
    resultado = parseFloat(resultado.toFixed(10));
    mostrarResultado(resultado);
    agregarAlHistorial(n1 + " " + operador + " " + n2, resultado);
  }

  function agregarAlHistorial(operacion, resultado) {
    vacio.hidden = true;
    const li = document.createElement("li");
    const izq = document.createElement("span");
    izq.textContent = operacion;
    const der = document.createElement("span");
    der.textContent = "= " + resultado;
    li.append(izq, der);
    historial.prepend(li);
  }

  document.getElementById("calcular").addEventListener("click", calcular);
  [inputN1, inputN2].forEach((i) =>
    i.addEventListener("keydown", (e) => { if (e.key === "Enter") calcular(); })
  );
</script>
</body>
</html>
